<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignedIt</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--soft:#f8f8f6;--ink:#1a1c1e;--muted:#686c70;--line:#dcdedb;--dark:#222428;--accent:#55595d;--danger:#9a3f3f;--shadow:0 12px 35px rgba(0,0,0,.06);--radius:10px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

/* --- Vogue Minimalist Top Navigation --- */
.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:24px;position:sticky;top:0;z-index:30}
.brand{font:600 24px Georgia,serif;letter-spacing:-.8px;color:var(--ink)}
.nav{display:flex;gap:6px;height:100%;align-items:center}
.nav button{border:0;background:none;padding:10px 14px;color:var(--muted);border-radius:8px;font-weight:500;transition:all .15s ease}
.nav button.active,.nav button:hover{background:var(--soft);color:var(--ink)}
.spacer{flex:1}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:500}
.userbox{display:flex;align-items:center;gap:11px}
.userbox small{display:block;color:var(--muted);font-size:11px;margin-top:1px}

/* --- Shell & Sidebar --- */
.shell{display:flex;min-height:calc(100vh - 70px)}
.side{width:240px;background:#fff;border-right:1px solid var(--line);padding:28px 16px}
.side h4{margin:0 12px 12px;color:#8a8e93;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.side button{display:flex;width:100%;border:0;background:none;padding:10px 12px;border-radius:8px;text-align:left;color:var(--muted);margin-bottom:3px;font-weight:500;transition:all .15s ease}
.side button:hover,.side button.active{background:var(--soft);color:var(--ink)}
.side .count{margin-left:auto;color:#999;font-size:12px}

/* --- Main Dashboard Area --- */
.main{flex:1;padding:36px 42px;min-width:0}
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
.page-title h1{font:500 32px Georgia,serif;margin:0 0 6px;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 16px;font-weight:500;transition:all .15s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--soft);border-color:#b5b8b5}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.dark:hover{background:#111}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* --- Cards & Grids --- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.02);transition:border-color .15s ease}
.card:hover{border-color:#bcbec0}
.template-card{min-height:160px;display:flex;flex-direction:column;justify-content:space-between}
.template-name{font-weight:600;font-size:15px;color:var(--ink)}
.meta{font-size:12px;color:var(--muted)}
.card-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.star{border:0;background:none;font-size:22px;color:#c0c2c5;padding:0;cursor:pointer;transition:color .15s}
.star.on{color:#e5a93b}
.empty{padding:80px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.4)}

/* --- Vogue Editor Layout (C) --- */
.editor-top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:12px}
.editor-name{min-width:240px;font-weight:600;font-size:15px}
.editor-layout{display:grid;grid-template-columns:200px minmax(450px,1fr) 280px;height:calc(100vh - 134px);overflow:hidden}
.toolbox,.properties{background:#fff;overflow:auto;padding:20px 14px}
.toolbox{border-right:1px solid var(--line)}
.properties{border-left:1px solid var(--line)}
.toolgroup{margin-bottom:22px}
.toolgroup h5{margin:0 8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#8a8e93;font-weight:600}
.field-tool{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;margin:4px 0;text-align:left;color:var(--accent);font-weight:500;transition:all .15s}
.field-tool:hover{background:var(--soft);color:var(--ink);border-color:#b5b8b5}
.canvas-wrap{overflow:auto;padding:35px;background:#e9e9e6}
.doc-page{position:relative;margin:0 auto 28px;background:#fff;box-shadow:0 8px 25px rgba(0,0,0,.1);width:min(820px,90%);border-radius:4px}
.doc-page canvas{width:100%;height:auto;display:block}
.overlay{position:absolute;inset:0}
.field{position:absolute;border:1px dashed var(--dark);background:rgba(240,240,238,.85);border-radius:4px;display:flex;align-items:center;justify-content:center;min-width:20px;min-height:20px;user-select:none;touch-action:none}
.field.selected{border:2px solid var(--dark);background:rgba(230,230,226,.95);z-index:10}
.field .tag{font-size:10px;color:var(--dark);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 5px}
.field .delete{position:absolute;right:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:0;background:var(--dark);color:#fff;font-size:12px;line-height:18px;padding:0;display:none;cursor:pointer}
.field.selected .delete{display:block}
.resize{position:absolute;right:-6px;bottom:-6px;width:11px;height:11px;background:var(--dark);border-radius:3px;display:none;cursor:nwse-resize}
.field.selected .resize{display:block}
.prop h3{font:500 22px Georgia,serif;margin:0 0 20px}
.prop label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 6px}
.prop input,.prop select,.prop textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}

/* --- Modals, Toasts & Signer UI --- */
.modal{position:fixed;inset:0;background:rgba(20,20,20,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100}
.modal-card{background:#fff;width:min(480px,92vw);border-radius:14px;padding:30px;box-shadow:var(--shadow);animation:siModalIn .2s ease}
@keyframes siModalIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-card h2{font:500 26px Georgia,serif;margin:0 0 8px;letter-spacing:-.5px}
.modal-card input,.modal-card select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin:6px 0 14px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--dark);color:#fff;padding:12px 18px;border-radius:8px;z-index:200;box-shadow:var(--shadow);font-weight:500}
.sign-shell{max-width:1080px;margin:0 auto;padding:32px}
.sign-head{background:#fff;border:1px solid var(--line);padding:18px 24px;border-radius:var(--radius);display:flex;align-items:center;gap:16px;margin-bottom:20px}
.sign-head h1{font:500 24px Georgia,serif;margin:0}
.sign-doc{background:#e9e9e6;padding:30px;border-radius:var(--radius)}
.sign-page{position:relative;margin:0 auto 24px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.1);max-width:820px;border-radius:4px}
.sign-page canvas{width:100%;display:block}
.sign-page .field{border:1px dashed #777;background:#fafaf8}
.sign-page .field.assigned{border:2px solid var(--dark);background:#f2f2ef}
.sign-footer{display:flex;justify-content:flex-end;margin-top:20px}
.notice{padding:12px 16px;background:var(--soft);border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:500}
.processing-overlay{position:fixed;inset:0;background:rgba(244,244,242,.88);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500}
.processing-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:32px 40px;text-align:center;box-shadow:var(--shadow);min-width:300px}
.spinner{width:28px;height:28px;border:3px solid #e0e2df;border-top-color:var(--dark);border-radius:50%;animation:siSpin .8s linear infinite;margin:0 auto 16px}@keyframes siSpin{to{transform:rotate(360deg)}}
.status-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600;background:var(--soft)}
.status-pill.active{background:#edf2ec;color:#2e5229;border-color:#d0e2cc}
.status-pill.trial{background:#f6f1e7;color:#6b521b;border-color:#eadeca}
.status-pill.suspended{background:#f6ecec;color:#6e2b2b;border-color:#e8cccc}
.invite-note{padding:14px 16px;border:1px solid var(--line);background:var(--soft);border-radius:8px;margin-top:12px;font-size:13px;color:var(--accent)}
@media(max-width:950px){.editor-layout{grid-template-columns:160px minmax(380px,1fr)}.properties{display:none}.side{width:200px}}@media(max-width:700px){.side{display:none}.main{padding:20px}.editor-layout{grid-template-columns:1fr}.toolbox{display:none}}
</style>
</head>
<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const API='https://script.google.com/macros/s/AKfycbwWwz1weCJ938Gq_dZ3Og6yDhPzMWFcOaRUIUbujEkXS0O7_HHRCJmpsqV-GMbCZPvU/exec';

const state={
  token:localStorage.getItem('si_token')||'',
  user:JSON.parse(localStorage.getItem('si_user')||'null'),
  view:'dashboard',
  section:'saved',
  templates:[],
  dashboardCache:null,
  signingCache:null,
  signingData:null,
  pdf:null,
  fields:[],
  pages:[],
  selected:null,
  tool:null,
  editorTemplateId:null,
  recipients:[],
  signingMode:'sequential',
  signToken:new URLSearchParams(location.search).get('token'),
  inviteToken:new URLSearchParams(location.search).get('invite'),
  completedMode:new URLSearchParams(location.search).get('completed')==='1',
  signingBusy:false,
  requestBusy:false
};

const $=s=>document.querySelector(s);

const esc=s=>String(s??'').replace(
  /[&<>'"]/g,
  c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#39;',
    '"':'&quot;'
  }[c])
);

function toast(m){
  const e=document.createElement('div');
  e.className='toast';
  e.textContent=m;
  $('#toastRoot').append(e);
  setTimeout(()=>e.remove(),2800);
}

/* --- Robust Action Wrapper with Auto-Loading & Double-Click Prevention --- */
async function runAction(btnSelector, loadingText, callback){
  if(state.requestBusy) return;
  const btn=typeof btnSelector==='string'?$(btnSelector):btnSelector;
  const origText=btn?btn.innerHTML:'';
  
  state.requestBusy=true;
  if(btn){
    btn.disabled=true;
    btn.innerHTML=`<span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 6px 0 0;display:inline-block"></span>${loadingText}`;
  }

  try{
    await callback();
  }finally{
    state.requestBusy=false;
    if(btn){
      btn.disabled=false;
      btn.innerHTML=origText;
    }
  }
}

async function api(action,data={}){
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{
        'Content-Type':'text/plain;charset=utf-8'
      },
      body:JSON.stringify({
        action,
        token:state.token,
        data
      })
    });

    const j=await r.json();

    if(!j.success&&j.error==='UNAUTHORIZED'){
      logoutLocal();
    }

    return j;

  }catch(e){
    return{
      success:false,
      message:'Could not reach the SignedIt backend.'
    };
  }
}

function logoutLocal(){
  state.token='';
  state.user=null;
  state.dashboardCache=null;
  state.signingCache=null;
  localStorage.removeItem('si_token');
  localStorage.removeItem('si_user');
  render();
}

function initials(n){
  return String(n||'U')
    .split(/\s+/)
    .slice(0,2)
    .map(x=>x[0])
    .join('')
    .toUpperCase();
}

function showLogin(){
  modal(`
    <h2>Welcome to SignedIt</h2>
    <div class="sub" style="margin-bottom:20px">
      Sign in to your document workspace.
    </div>

    <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Email address</label>
    <input id="mEmail" type="email" placeholder="name@company.com">

    <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Password</label>
    <input id="mPass" type="password" placeholder="••••••••">

    <div id="mErr" class="small" style="color:var(--danger);margin-top:4px"></div>

    <div class="modal-actions" style="margin-top:24px">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" id="loginBtn" onclick="runAction('#loginBtn','Signing in...', doLogin)">Sign in</button>
    </div>
  `);
}

function modal(html){
  $('#modalRoot').innerHTML=`
    <div class="modal" onclick="if(event.target===this)closeModal()">
      <div class="modal-card">${html}</div>
    </div>
  `;
}

function closeModal(){
  $('#modalRoot').innerHTML='';
}

async function doLogin(){
  const email=$('#mEmail').value;
  const password=$('#mPass').value;

  const r=await api('login',{
    email,
    password
  });

  if(!r.success){
    $('#mErr').textContent=r.message;
    return;
  }

  state.token=r.data.token;
  state.user=r.data;

  localStorage.setItem('si_token',state.token);
  localStorage.setItem('si_user',JSON.stringify(state.user));

  closeModal();
  render();
  toast('Welcome back.');
}

async function doLogout(){
  await runAction(null, '', async()=>{
    await api('logout');
    logoutLocal();
  });
}

function render(){
  if(state.signToken&&state.completedMode){
    renderCompletedDocument();
    return;
  }
  if(state.signToken){
    renderSigner();
    return;
  }
  if(state.inviteToken&&!state.token){
    renderInvite();
    return;
  }
  if(!state.token){
    renderLanding();
    return;
  }
  if(String(state.user?.role||'').toLowerCase()==='developer'){
    renderDeveloper();
    return;
  }
  if(state.view==='editor'){
    renderEditor();
  }else{
    renderApp();
  }
}

/* =========================================================
   DESIGN A: LANDING & LOGIN PAGE
   ========================================================= */

function renderLanding(){
  $('#app').innerHTML=`
    <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
      <div style="text-align:center;max-width:560px;padding:40px 20px">
        <div class="brand" style="font-size:42px;margin-bottom:18px">SignedIt</div>
        <h1 style="font:500 36px Georgia,serif;margin:0 0 14px;letter-spacing:-.5px">
          Sophisticated e-signing, perfectly controlled.
        </h1>
        <p class="sub" style="font-size:16px;line-height:1.7;margin-bottom:30px">
          Design templates, manage secure client workflows, and collect signatures with pristine elegance. Signers enjoy a friction-free experience with zero account friction.
        </p>
        <button class="btn dark" style="padding:12px 28px;font-size:15px" onclick="showLogin()">
          Sign in to workspace
        </button>
      </div>
    </div>
  `;
}

/* =========================================================
   HEADQUARTERS (DEVELOPER) VIEWS
   ========================================================= */

function renderDeveloper(){
  $('#app').innerHTML=`
    <header class="top">
      <div class="brand">SignedIt</div>
      <nav class="nav"><button class="active">Headquarters</button></nav>
      <div class="spacer"></div>
      <div class="userbox">
        <div class="avatar">${initials(state.user?.name)}</div>
        <div>
          <b>${esc(state.user?.name)}</b>
          <small>Developer</small>
        </div>
      </div>
      <button class="btn" onclick="doLogout()">Log out</button>
    </header>
    <main id="hqMain"></main>
  `;
  loadDeveloperDashboard();
}

async function loadDeveloperDashboard(){
  const m=$('#hqMain');
  if(!m) return;
  m.innerHTML='<div style="padding:40px" class="sub">Loading Headquarters...</div>';
  const r=await api('developerDashboard');
  if(!r.success){ m.innerHTML=`<div style="padding:40px" class="empty">${esc(r.message)}</div>`; return; }

  const d=r.data;
  const s=d.stats||{};

  m.innerHTML=`
    <div style="max-width:1250px;margin:0 auto;padding:36px 42px">
      <div class="page-title">
        <div>
          <h1>SignedIt Headquarters</h1>
          <div class="sub">Platform overview and client company management</div>
        </div>
        <button class="btn dark" onclick="showOnboardCompany()">+ Onboard Company</button>
      </div>

      <div class="cards" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:28px">
        <div class="card"><div class="meta">Companies</div><div style="font:500 26px Georgia,serif;margin-top:6px">${s.companies||0}</div></div>
        <div class="card"><div class="meta">Active</div><div style="font:500 26px Georgia,serif;margin-top:6px">${s.activeCompanies||0}</div></div>
        <div class="card"><div class="meta">Trial</div><div style="font:500 26px Georgia,serif;margin-top:6px">${s.trialCompanies||0}</div></div>
        <div class="card"><div class="meta">Users</div><div style="font:500 26px Georgia,serif;margin-top:6px">${s.users||0}</div></div>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:18px 20px;border-bottom:1px solid var(--line);font-weight:600">Client Companies</div>
        <div>
          ${d.companies.length?d.companies.map(c=>`
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;padding:14px 20px;align-items:center;border-bottom:1px solid var(--line)">
              <div>
                <b>${esc(c.name)}</b>
                <div class="sub">${esc(c.primaryAdminEmail||'No admin email')}</div>
              </div>
              <div><span class="status-pill ${esc(String(c.status).toLowerCase())}">${esc(c.status)}</span></div>
              <div>${esc(c.plan)}</div>
              <div>${esc(c.totalUsers||0)} users</div>
              <div><button class="btn" onclick="manageCompany('${c.companyId}')">Manage</button></div>
            </div>
          `).join(''):'<div class="empty">No client companies onboarded yet.</div>'}
        </div>
      </div>
    </div>
  `;
}

function showOnboardCompany(){
  modal(`
    <h2>Onboard Company</h2>
    <div class="sub" style="margin-bottom:14px">Create a new client company workspace.</div>
    <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Company Name</label>
    <input id="ocName" placeholder="Business name">
    <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Admin Full Name</label>
    <input id="ocAdmin" placeholder="Full name">
    <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)">Admin Email</label>
    <input id="ocEmail" type="email" placeholder="admin@company.com">
    <div id="ocErr" class="small" style="color:var(--danger)"></div>
    <div class="modal-actions" style="margin-top:20px">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" id="onboardCompBtn" onclick="runAction('#onboardCompBtn','Onboarding...', submitOnboardCompany)">Onboard Company</button>
    </div>
  `);
}

async function submitOnboardCompany(){
  const companyName=$('#ocName').value.trim();
  const adminName=$('#ocAdmin').value.trim();
  const adminEmail=$('#ocEmail').value.trim();
  if(!companyName||!adminName||!adminEmail){ $('#ocErr').textContent='Please fill in all fields.'; return; }

  const r=await api('onboardCompany',{companyName,adminName,adminEmail,acceptUrl:location.origin+location.pathname});
  if(!r.success){ $('#ocErr').textContent=r.message; return; }
  closeModal();
  toast('Company onboarded successfully.');
  loadDeveloperDashboard();
}

async function manageCompany(companyId){
  const r=await api('getHQCompany',{companyId});
  if(!r.success){ toast(r.message); return; }
  const c=r.data.company;
  const u=r.data.usage;

  modal(`
    <h2>${esc(c.name)}</h2>
    <div class="sub" style="margin-bottom:16px">Company metadata and management</div>
    <div style="margin-bottom:12px"><b>Admin:</b> ${esc(c.primaryAdminEmail)}</div>
    <div style="margin-bottom:12px"><b>Status:</b> ${esc(c.status)}</div>
    <div style="margin-bottom:12px"><b>Plan:</b> ${esc(c.plan)}</div>
    <div style="margin-bottom:16px"><b>Users:</b> ${u.users} total (${u.activeUsers} active)</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
      <button class="btn dark" onclick="resendAdminInviteModal('${c.companyId}')">Resend Admin Invite</button>
    </div>
  `);
}

async function resendAdminInviteModal(companyId){
  const r=await api('resendCompanyAdminInvite',{companyId,acceptUrl:location.origin+location.pathname});
  if(!r.success){ toast(r.message); return; }
  closeModal();
  toast(r.data.alreadyActive?'Admin account is already active.':'Admin invitation sent.');
}

/* =========================================================
   DESIGN B: MAIN DASHBOARD & APP
   ========================================================= */

function renderApp(){
  const u=state.user||{};
  const isAdmin=String(u.role||'').toLowerCase()==='admin';

  $('#app').innerHTML=`
    <header class="top">
      <div class="brand">SignedIt</div>
      <nav class="nav">

async function loadDashboard(){
  const m=$('#main');
  if(!m) return;

  if(state.section==='team'){
    loadTeamSection();
    return;
  }

  const isSigningSection=['action','pending','completed'].includes(state.section);

  if(isSigningSection){
    if(!state.signingCache){
      m.innerHTML='<div class="sub">Loading signing envelopes…</div>';
      const r=await api('listSigning');
      if(!r.success){
        m.innerHTML=`<div class="empty">${esc(r.message)}</div>`;
        return;
      }
      state.signingCache=r.data;
    }

    const data=state.signingCache;
    let list=[];
    let title='';
    if(state.section==='action'){ list=data.actionRequired; title='Action Required'; }
    else if(state.section==='pending'){ list=data.pending; title='Pending'; }
    else if(state.section==='completed'){ list=data.completed; title='Completed'; }

    m.innerHTML=`
      <div class="page-title">
        <div>
          <h1>${title}</h1>
          <div class="sub">Active signing transactions and secure envelopes</div>
        </div>
      </div>
      ${list.length?`<div class="cards">${list.map(signingEnvelopeCard).join('')}</div>`:`<div class="empty"><b>No ${title.toLowerCase()} documents.</b></div>`}
    `;
    return;
  }

  if(!state.dashboardCache){
    m.innerHTML='<div class="sub">Loading workspace…</div>';
    const r=await api('listDashboard');
    if(!r.success){
      m.innerHTML=`<div class="empty">${esc(r.message)}</div>`;
      return;
    }
    state.dashboardCache=r.data;
  }

  const data=state.dashboardCache;
  let list=[];
  let title='Saved';

  if(state.section==='created'){ list=data.createdByMe; title='Created by Me'; }
  else if(state.section==='shared'){ list=data.sharedWithMe; title='Shared with Me'; }
  else if(state.section==='recent'){ list=data.recentlyUsed; title='Recently Used'; }
  else if(state.section==='favorites'){ list=data.favorites; title='Favorites'; }
  else if(state.section==='templates'){ list=data.saved; title='Templates'; }
  else { list=data.saved; title='Saved'; }

  m.innerHTML=`
    <div class="page-title">
      <div>
        <h1>${title}</h1>
        <div class="sub">Your pristine document repository</div>
      </div>
      <div>
        <button class="btn dark" onclick="newTemplate()">+ Create template</button>
      </div>
    </div>

    ${state.user.role==='admin'?`
      <div class="invite-note" style="margin-bottom:20px">
        <b>Document Storage</b>
        <div style="margin-top:4px">${data.storageConnected?'✓ Storage configured and active.':'Storage workspace preparing.'}</div>
      </div>
    `:''}

    ${list.length?`<div class="cards">${list.map(templateCard).join('')}</div>`:`<div class="empty"><b>No ${title.toLowerCase()} yet.</b><div style="margin-top:6px">Create a template to begin.</div></div>`}
  `;
}

async function downloadEnvPdf(envelopeId){
  const r=await api('getCompletedEnvelope',{envelopeId});
  if(!r.success){ toast(r.message); return; }
  const bytes=Uint8Array.from(atob(r.data.pdfBase64),c=>c.charCodeAt(0));
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=r.data.documentName||'SignedIt - Completed.pdf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function newTemplate(){
  const input=document.createElement('input');
  input.type='file';
  input.accept='application/pdf';
  input.onchange=async()=>{
    const f=input.files[0];
    if(!f)return;
    state.editorTemplateId=null;
    state.fields=[];
    await loadEditorPdf(await f.arrayBuffer());
    state.view='editor';
    render();
  };
  input.click();
}

async function openTemplate(id){
  const r=await api('getTemplate',{templateId:id});
  if(!r.success){ return toast(r.message); }
  state.editorTemplateId=id;
  state.fields=r.data.fields;
  await loadEditorPdf(fromB64(r.data.pdfBase64));
  state.editorName=r.data.name;
  state.view='editor';
  render();
}

function fromB64(s){
  const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  return b.buffer;
}

function toB64(buf){
  const b=new Uint8Array(buf);
  let s='';
  for(let i=0;i<b.length;i+=0x8000){ s+=String.fromCharCode(...b.subarray(i,i+0x8000)); }
  return btoa(s);
}

async function loadEditorPdf(buf){
  state.pdf=buf;
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
  state.pages=[];
  state.renderedPages=[];
  const holder=document.createElement('div');
  for(let n=1;n<=pdf.numPages;n++){
    const p=await pdf.getPage(n);
    const vp=p.getViewport({scale:1.5});
    const canvas=document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    const page=document.createElement('div'); page.className='doc-page';
    const ov=document.createElement('div'); ov.className='overlay'; ov.dataset.page=n-1;
    page.append(canvas,ov);
    state.pages.push({ov,ratio:vp.width/vp.height});
    holder.append(page);
  }
  state.renderedPages=Array.from(holder.children);
}

function renderEditor(){
  if(!state.renderedPages){ renderLanding(); return; }
  $('#app').innerHTML=`
    <div class="editor-top">
      <button class="btn" onclick="state.view='dashboard';state.dashboardCache=null;render()">← Back</button>
      <div class="editor-name">${esc(state.editorName||'Untitled template')}</div>

          <h5>Standard</h5>
          ${tool('signature','Signature')}
          ${tool('initials','Initials')}
          ${tool('name','Name')}
          ${tool('email','Email')}
          ${tool('date','Date')}
        </div>
        <div class="toolgroup">
          <h5>Input</h5>
          ${tool('text','Text')}
          ${tool('long_text','Long text')}
          ${tool('number','Number')}
        </div>
        <div class="toolgroup">
          <h5>Selection</h5>

        </div>

  `;

  const cw=$('#canvasWrap');

function tool(t,label){
  return `<button class="field-tool" onclick="selectTool('${t}')">${label}</button>`;
}

function selectTool(t){
  state.tool=state.tool===t?null:t;
  toast(state.tool?'Click document to place '+t:'Tool cancelled');
}

function placeField(e,ov){
  if(!state.tool||e.target!==ov)return;
  const r=ov.getBoundingClientRect();
  const sizes={signature:[.28,.07],initials:[.12,.05],text:[.25,.04],long_text:[.35,.09],number:[.16,.04],name:[.25,.04],email:[.28,.04],date:[.18,.04],checkbox:[.035,.035],dropdown:[.25,.04]};
  const [w,h]=sizes[state.tool]||[.2,.04];
  const x=Math.max(0,Math.min((e.clientX-r.left)/r.width,1-w));
  const y=Math.max(0,Math.min((e.clientY-r.top)/r.height,1-h));

  state.fields.push({
    id:crypto.randomUUID?.()||Math.random().toString(36).slice(2),
    type:state.tool, page:+ov.dataset.page, x, y, w, h,
    required:state.tool!=='checkbox', recipientRole:'1',
    properties:{options:['Option 1','Option 2']}
  });
  state.tool=null;
  renderFields();
}

function renderFields(){
  state.pages.forEach(p=>{
    p.ov.innerHTML='';
    p.ov.onclick=e=>placeField(e,p.ov);
  });
  state.fields.forEach(f=>{
    const el=document.createElement('div');
    el.className='field'+(state.selected===f.id?' selected':'');
    el.style.cssText=`left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%`;
    el.onclick=e=>{e.stopPropagation();state.selected=f.id;renderFields();};

    const del=document.createElement('button');
    del.className='delete'; del.textContent='×';
    del.onclick=e=>{e.stopPropagation();state.fields=state.fields.filter(x=>x.id!==f.id);state.selected=null;renderFields();};
    el.append(del);

    const tag=document.createElement('div');
    tag.className='tag'; tag.textContent=f.type==='checkbox'?'☐':f.type.replace('_',' ');
    el.append(tag);

    const rz=document.createElement('div');
    rz.className='resize';
    rz.onpointerdown=e=>dragField(e,f,el,'resize');
    el.append(rz);

    el.onpointerdown=e=>{if(e.target===del||e.target===rz)return;dragField(e,f,el,'move');};
    state.pages[f.page]?.ov.append(el);
  });
  renderProperties();
}

function dragField(e,f,el,kind){
  e.preventDefault(); e.stopPropagation();
  state.selected=f.id;
  const r=el.parentElement.getBoundingClientRect();
  const sx=e.clientX, sy=e.clientY, ox=f.x, oy=f.y, ow=f.w, oh=f.h;
  const move=ev=>{
    const dx=(ev.clientX-sx)/r.width, dy=(ev.clientY-sy)/r.height;
    if(kind==='move'){
      f.x=Math.min(Math.max(ox+dx,0),1-f.w);
      f.y=Math.min(Math.max(oy+dy,0),1-f.h);
    }else{
      f.w=Math.min(Math.max(ow+dx,.02),1-f.x);
      f.h=Math.min(Math.max(oh+dy,.02),1-f.y);
    }
    el.style.left=f.x*100+'%'; el.style.top=f.y*100+'%';
    el.style.width=f.w*100+'%'; el.style.height=f.h*100+'%';
  };
  const up=()=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);renderProperties();};
  addEventListener('pointermove',move); addEventListener('pointerup',up);
}

function renderProperties(){
  const p=$('#properties');
  if(!p)return;
  const f=state.fields.find(x=>x.id===state.selected);
  if(!f){ p.innerHTML='<div class="sub">Select a field to customize its properties.</div>'; return; }

  p.innerHTML=`
    <div class="prop">
      <h3>${esc(f.type.replace('_',' '))}</h3>
      <label>Assigned Signer</label>
      <select id="pRecipient">
        <option value="1" ${f.recipientRole==='1'?'selected':''}>Signer 1</option>
        <option value="2" ${f.recipientRole==='2'?'selected':''}>Signer 2</option>
        <option value="3" ${f.recipientRole==='3'?'selected':''}>Signer 3</option>
      </select>
      <label>Requirement</label>
      <select id="pReq">
        <option value="1" ${f.required?'selected':''}>Required</option>
        <option value="0" ${!f.required?'selected':''}>Optional</option>
      </select>
      ${f.type==='dropdown'?`<label>Options (one per line)</label><textarea id="pOpts" rows="5">${esc((f.properties?.options||[]).join('\n'))}</textarea>`:''}
    </div>
  `;

  $('#pRecipient').onchange=e=>f.recipientRole=e.target.value;
  $('#pReq').onchange=e=>f.required=e.target.value==='1';
  if($('#pOpts')){
    $('#pOpts').oninput=e=>f.properties.options=e.target.value.split('\n').map(x=>x.trim()).filter(Boolean);
  }
}

async function createAndSend(templateId){

async function renderSignPdf(data){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(fromB64(data.pdfBase64))}).promise;
  const host=$('#signDoc');
  for(let n=1;n<=pdf.numPages;n++){
    const p=await pdf.getPage(n);
    const vp=p.getViewport({scale:1.5});
    const canvas=document.createElement('canvas');
    canvas.width=vp.width; canvas.height=vp.height;
    await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    const pg=document.createElement('div'); pg.className='sign-page';
    const ov=document.createElement('div'); ov.className='overlay';
    pg.append(canvas,ov); host.append(pg);

    data.fields.filter(f=>f.page===n-1).forEach(f=>{
      const el=document.createElement('div');
      el.className='field'+(String(f.recipientRole||'')===String(data.recipient.sequence)?' assigned':'');
      el.style.cssText=`left:${f.x*100}%;top:${f.y*100}%;width:${f.w*100}%;height:${f.h*100}%`;
      const owned=!f.recipientRole||String(f.recipientRole)===String(data.recipient.sequence);
      if(!owned){ el.style.pointerEvents='none'; el.style.background='transparent'; el.style.border='0'; ov.append(el); return; }

      if(f.type==='signature'||f.type==='initials'){
        el.textContent=f.value?'Signed':'Click to sign';
        el.onclick=()=>signatureFor(f,el);
      }else if(f.type==='checkbox'){
        const c=document.createElement('input'); c.type='checkbox'; c.checked=f.value===true||f.value==='true';
        c.onchange=()=>f.value=c.checked; el.append(c);
      }else if(f.type==='dropdown'){
        const s=document.createElement('select');
        (f.properties?.options||[]).forEach(o=>{const op=document.createElement('option'); op.textContent=o; op.value=o; s.append(op);});
        s.value=f.value||''; s.onchange=()=>f.value=s.value; el.append(s);
      }else{
        const i=document.createElement('input'); i.type=f.type==='number'?'number':'text'; i.value=f.value||'';
        i.oninput=()=>f.value=i.value; el.append(i);
      }
      ov.append(el);
    });
  }
}

let sigTarget=null, sigTargetElement=null;
function signatureFor(f,el){
  sigTarget=f; sigTargetElement=el;
  modal(`
    <h2>Your Signature</h2>
    <canvas id="sigPad" width="600" height="180" style="width:100%;border:1px dashed var(--line);border-radius:8px;touch-action:none;background:#fafaf8"></canvas>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn dark" onclick="applySignerSig()">Apply Signature</button>
    </div>
  `);
  const c=$('#sigPad'), ctx=c.getContext('2d'); let down=false;
  c.onpointerdown=e=>{down=true; c.setPointerCapture(e.pointerId); const r=c.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);};
  c.onpointermove=e=>{if(!down)return; const r=c.getBoundingClientRect(); ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height); ctx.stroke();};
  c.onpointerup=()=>down=false;
}

function applySignerSig(){
  const c=$('#sigPad');
  if(!c||!sigTarget)return;
  sigTarget.value=c.toDataURL('image/png');
  closeModal();
  if(sigTargetElement){ sigTargetElement.textContent='Signed'; sigTargetElement.classList.add('assigned'); }
  sigTarget=null; sigTargetElement=null;
}

async function submitSigner(){
  const data={};
  for(const f of state.signingData.fields){
    const owned=!f.recipientRole||String(f.recipientRole)===String(state.signingData.recipient.sequence);
    if(!owned)continue;
    if(f.required&&(!f.value||String(f.value)==='')){ toast('Please complete all required fields.'); return; }
    data[f.id]=f.value;
  }

  showProcessing('Processing signature…','Saving your cryptographic signing step and generating document version.');
  try{
    const finalPdfBase64=await buildCompletedPdf();
    const r=await api('submitSigning',{token:state.signToken,values:data,pdfBase64:finalPdfBase64,signingUrl:location.origin+location.pathname});
    hideProcessing();
    if(!r.success){ toast(r.message); return; }

    $('#app').innerHTML=`
      <div class="sign-shell">
        <div class="empty">
          <div class="brand" style="margin-bottom:14px">SignedIt</div>
          <h2 style="font:500 26px Georgia,serif">${r.data.envelopeCompleted?'Document Completed':'Step Complete'}</h2>
          <div style="margin-top:8px">${r.data.envelopeCompleted?'All parties have signed. A final copy has been emailed.':'Your step has been recorded successfully.'}</div>
          ${r.data.envelopeCompleted?`<div style="margin-top:20px"><button class="btn dark" onclick="downloadCompleted()">Download Signed PDF</button></div>`:''}
        </div>
      </div>
    `;
  }catch(e){
    hideProcessing();
    toast('Error: '+e.message);
  }
}

function showProcessing(title,message){
  let root=document.getElementById('processingRoot');
  if(!root){ root=document.createElement('div'); root.id='processingRoot'; document.body.append(root); }
  root.innerHTML=`
    <div class="processing-overlay">
      <div class="processing-card">
        <div class="spinner"></div>
        <div style="font:500 20px Georgia,serif;margin-bottom:6px">${esc(title)}</div>
        <div class="sub">${esc(message)}</div>
      </div>
    </div>
  `;
}
function hideProcessing(){ const root=document.getElementById('processingRoot'); if(root)root.remove(); }

function pdfFieldRect(page,f){
  const pageW=page.getWidth(), pageH=page.getHeight();
  const nx=Math.max(0,Math.min(1,Number(f.x)||0)), ny=Math.max(0,Math.min(1,Number(f.y)||0));
  const nw=Math.max(0,Math.min(1-nx,Number(f.w)||0)), nh=Math.max(0,Math.min(1-ny,Number(f.h)||0));
  return{x:nx*pageW, y:pageH-((ny+nh)*pageH), width:nw*pageW, height:nh*pageH};
}

async function buildCompletedPdf(){
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const pdfDoc=await PDFDocument.load(fromB64(state.signingData.pdfBase64));
  const font=await pdfDoc.embedFont(StandardFonts.Helvetica);
  const currentSequence=String(state.signingData.recipient.sequence);

  for(const f of state.signingData.fields){
    const owned=!f.recipientRole||String(f.recipientRole)===currentSequence;
    if(!owned||!f.value)continue;
    const pageIndex=Number(f.page);
    const page=pdfDoc.getPages()[pageIndex];
    const rect=pdfFieldRect(page,f);

    if(f.type==='signature'||f.type==='initials'){
      if(String(f.value).startsWith('data:image/')){
        const bytes=Uint8Array.from(atob(String(f.value).split(',')[1]),c=>c.charCodeAt(0));
        const image=await pdfDoc.embedPng(bytes);
        const dims=image.scale(1);
        const scale=Math.min(rect.width/dims.width,rect.height/dims.height);
        page.drawImage(image,{x:rect.x+(rect.width-dims.width*scale)/2, y:rect.y+(rect.height-dims.height*scale)/2, width:dims.width*scale, height:dims.height*scale});
      }
      continue;
    }
    if(f.type==='checkbox'){
      if(f.value===true){
        page.drawText('X',{x:rect.x+rect.width/2-4, y:rect.y+rect.height/2-4, size:12, font, color:rgb(0,0,0)});
      }
      continue;
    }
    page.drawText(String(f.value),{x:rect.x+4, y:rect.y+rect.height/2-4, size:10, font, color:rgb(0,0,0)});
  }
  return toB64(await pdfDoc.save());
}

async function renderCompletedDocument(){
  $('#app').innerHTML=`
    <div class="sign-shell"><div class="empty"><div class="spinner"></div><h2>Retrieving document...</h2></div></div>
  `;
  const r=await api('completedDocument',{token:state.signToken});
  if(!r.success){ toast(r.message); return; }
  $('#app').innerHTML=`
    <div class="sign-shell">
      <div class="empty">
        <div class="brand" style="margin-bottom:14px">SignedIt</div>
        <h2 style="font:500 26px Georgia,serif">Document Ready</h2>
        <div class="sub">${esc(r.data.documentName)}</div>
        <div style="margin-top:20px"><button class="btn dark" onclick="downloadCompleted()">Download Signed PDF</button></div>
      </div>
    </div>
  `;
}

async function downloadCompleted(){
  const r=await api('completedDocument',{token:state.signToken});
  if(!r.success){ toast(r.message); return; }
  const bytes=Uint8Array.from(atob(r.data.pdfBase64),c=>c.charCodeAt(0));
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='SignedIt - Completed.pdf';
  document.body.append(a); a.click(); a.remove();
}

render();
</script>
