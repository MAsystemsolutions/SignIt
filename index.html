<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignedIt</title>
<style>
:root{--bg:#f4f5f9;--ink:#1c2033;--brand:#4f46e5;--line:#d9dce8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:18px;margin:0 12px 0 0;color:var(--brand)}
button,label.btn{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
button:hover,label.btn:hover{background:#eef0ff}
button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
#hint{font-size:13px;color:#667}
#pages{padding:16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.page{position:relative;width:100%;max-width:820px;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.page canvas{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0}
.f{position:absolute;border:2px solid var(--brand);background:rgba(79,70,229,.12);border-radius:3px;font-size:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
.edit .f{cursor:move}
.f .x{position:absolute;top:0;right:0;width:18px;height:18px;line-height:16px;text-align:center;background:var(--brand);color:#fff;cursor:pointer;font-size:13px}
.f .rz{position:absolute;right:0;bottom:0;width:14px;height:14px;background:var(--brand);cursor:nwse-resize}
.f input[type=text],.f input[type=date]{width:100%;height:100%;border:0;background:transparent;font:inherit;font-size:13px;padding:0 4px;outline:none}
.f input[type=checkbox]{width:80%;height:80%}
.f img{max-width:100%;max-height:100%}
.f.sig{cursor:pointer}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:min(540px,94vw)}
#pad{width:100%;border:1px dashed #999;border-radius:8px;touch-action:none;background:#fff}
#modal input[type=text]{width:100%;padding:8px;margin:8px 0;font:inherit;border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:8px;justify-content:flex-end}
.m2{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60}
.m2 .box{background:#fff;border-radius:12px;padding:16px;width:min(420px,94vw);max-height:80vh;overflow:auto}
.m2 input{width:100%;padding:8px;margin:5px 0;font:inherit;border:1px solid var(--line);border-radius:8px}
.tl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>SignedIt</h1>
  <label class="btn">Upload PDF<input id="file" type="file" accept="application/pdf" hidden></label>
  <span class="sep"></span>
  <button id="mEdit" class="on">Edit fields</button>
  <button id="mSign">Sign</button>
  <span class="sep"></span>
  <span id="tools">
    <button data-t="text">Text</button>
    <button data-t="name">Name</button>
    <button data-t="date">Date</button>
    <button data-t="checkbox">Checkbox</button>
    <button data-t="signature">Signature</button>
  </span>
  <span class="sep"></span>
  <button id="dl" class="primary">Download signed PDF</button>
  <span class="sep"></span>
  <button id="saveT">Save template</button>
  <button id="loadT">My templates</button>
  <button id="acct">Log in</button>
  <span id="hint">Upload a PDF to begin.</span>
</header>
<div id="pages"></div>

<div id="modal"><div class="box">
  <b>Draw your signature</b>
  <canvas id="pad" width="500" height="160"></canvas>
  <input id="typed" type="text" placeholder="…or type your name here">
  <div class="row"><button id="clr">Clear</button><button id="cancel">Cancel</button><button id="apply" class="primary">Apply</button></div>
</div></div>

<div class="m2" id="authM"><div class="box">
  <b id="authT">Log in</b>
  <input id="aCompany" type="text" placeholder="Company name" style="display:none">
  <input id="aName" type="text" placeholder="Your name" style="display:none">
  <input id="aEmail" type="text" placeholder="Email">
  <input id="aPass" type="password" placeholder="Password (min 8 characters)">
  <div class="row"><button id="aSwitch">Create account</button><button id="aClose">Close</button><button id="aGo" class="primary">Log in</button></div>
  <div id="aMsg" style="font-size:13px;margin-top:6px"></div>
</div></div>
<div class="m2" id="listM"><div class="box">
  <b>My templates</b>
  <div id="tl"></div>
  <div class="row" style="margin-top:8px"><button id="lClose">Close</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const S = { buf: null, pages: [], fields: [], mode: "edit", tool: null, sigTarget: null };
const $ = (s) => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);

// ---------- Load & render PDF ----------
$("#file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  S.name = file.name.replace(/\.pdf$/i, "");
  S.templateId = null;
  await loadPdf(await file.arrayBuffer(), []);
};
async function loadPdf(buf, fields) {
  S.buf = buf;
  S.fields = fields;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(S.buf.slice(0)) }).promise;
  const host = $("#pages");
  host.innerHTML = "";
  S.pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement("canvas");
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    const wrap = document.createElement("div");
    wrap.className = "page";
    const ov = document.createElement("div");
    ov.className = "ov";
    ov.dataset.page = n - 1;
    ov.onclick = (ev) => placeField(ev, ov);
    wrap.append(canvas, ov);
    host.append(wrap);
    S.pages.push({ ov, ratio: vp.width / vp.height });
  }
  setMode("edit");
  $("#hint").textContent = "Pick a field type, then click on the page to place it. Drag to move, corner to resize.";
}

// ---------- Modes & tools ----------
function setMode(m) {
  S.mode = m; S.tool = null;
  $("#mEdit").classList.toggle("on", m === "edit");
  $("#mSign").classList.toggle("on", m === "sign");
  $("#tools").style.display = m === "edit" ? "" : "none";
  document.querySelectorAll("#tools button").forEach((b) => b.classList.remove("on"));
  $("#pages").classList.toggle("edit", m === "edit");
  if (S.pages.length) $("#hint").textContent = m === "sign" ? "Fill in the fields, then download." : "Pick a field type, then click on the page to place it.";
  renderFields();
}
$("#mEdit").onclick = () => setMode("edit");
$("#mSign").onclick = () => setMode("sign");
document.querySelectorAll("#tools button").forEach((b) => {
  b.onclick = () => {
    S.tool = S.tool === b.dataset.t ? null : b.dataset.t;
    document.querySelectorAll("#tools button").forEach((x) => x.classList.toggle("on", x.dataset.t === S.tool));
  };
});

// ---------- Fields ----------
function placeField(ev, ov) {
  if (S.mode !== "edit" || !S.tool || ev.target !== ov) return;
  const r = ov.getBoundingClientRect();
  const pg = S.pages[+ov.dataset.page];
  const sizes = { text: [0.25, 0.035], name: [0.25, 0.035], date: [0.18, 0.035], signature: [0.28, 0.07], checkbox: [0.03, 0.03 * pg.ratio] };
  const [w, h] = sizes[S.tool];
  const x = Math.min(Math.max((ev.clientX - r.left) / r.width, 0), 1 - w);
  const y = Math.min(Math.max((ev.clientY - r.top) / r.height, 0), 1 - h);
  S.fields.push({ id: uid(), type: S.tool, page: +ov.dataset.page, x, y, w, h, value: S.tool === "checkbox" ? false : "" });
  S.tool = null;
  document.querySelectorAll("#tools button").forEach((b) => b.classList.remove("on"));
  renderFields();
}

function renderFields() {
  S.pages.forEach((p) => (p.ov.innerHTML = ""));
  S.fields.forEach((f) => {
    const el = document.createElement("div");
    el.className = "f" + (f.type === "signature" ? " sig" : "");
    Object.assign(el.style, { left: f.x * 100 + "%", top: f.y * 100 + "%", width: f.w * 100 + "%", height: f.h * 100 + "%" });
    if (S.mode === "edit") {
      if (f.type !== "checkbox") el.append(f.type[0].toUpperCase() + f.type.slice(1));
      const x = document.createElement("div"); x.className = "x"; x.textContent = "×";
      x.onpointerdown = (e) => e.stopPropagation();
      x.onclick = () => { S.fields = S.fields.filter((q) => q.id !== f.id); renderFields(); };
      const rz = document.createElement("div"); rz.className = "rz";
      rz.onpointerdown = (e) => startDrag(e, f, el, "resize");
      el.append(x, rz);
      el.onpointerdown = (e) => startDrag(e, f, el, "move");
    } else if (f.type === "checkbox") {
      const c = document.createElement("input"); c.type = "checkbox"; c.checked = f.value;
      c.onchange = () => (f.value = c.checked);
      el.append(c);
    } else if (f.type === "signature") {
      if (f.value) { const i = document.createElement("img"); i.src = f.value; el.append(i); }
      else el.append("Click to sign");
      el.onclick = () => openSig(f);
    } else {
      const i = document.createElement("input");
      i.type = f.type === "date" ? "date" : "text";
      i.placeholder = f.type === "name" ? "Full name" : f.type === "date" ? "" : "Type here";
      i.value = f.value;
      i.oninput = () => (f.value = i.value);
      el.append(i);
    }
    S.pages[f.page].ov.append(el);
  });
}

function startDrag(e, f, el, kind) {
  e.preventDefault(); e.stopPropagation();
  const r = el.parentElement.getBoundingClientRect();
  const sx = e.clientX, sy = e.clientY, ox = f.x, oy = f.y, ow = f.w, oh = f.h;
  const move = (ev) => {
    const dx = (ev.clientX - sx) / r.width, dy = (ev.clientY - sy) / r.height;
    if (kind === "move") {
      f.x = Math.min(Math.max(ox + dx, 0), 1 - f.w);
      f.y = Math.min(Math.max(oy + dy, 0), 1 - f.h);
    } else {
      f.w = Math.min(Math.max(ow + dx, 0.02), 1 - f.x);
      f.h = Math.min(Math.max(oh + dy, 0.02), 1 - f.y);
    }
    Object.assign(el.style, { left: f.x * 100 + "%", top: f.y * 100 + "%", width: f.w * 100 + "%", height: f.h * 100 + "%" });
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

// ---------- Signature pad ----------
const pad = $("#pad"), pctx = pad.getContext("2d");
let drawing = false;
function padClear() { pctx.clearRect(0, 0, pad.width, pad.height); }
function padPos(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) * pad.width / r.width, (e.clientY - r.top) * pad.height / r.height]; }
pad.onpointerdown = (e) => { drawing = true; pad.setPointerCapture(e.pointerId); const [x, y] = padPos(e); pctx.beginPath(); pctx.moveTo(x, y); $("#typed").value = ""; };
pad.onpointermove = (e) => { if (!drawing) return; const [x, y] = padPos(e); pctx.lineWidth = 3; pctx.lineCap = "round"; pctx.strokeStyle = "#111"; pctx.lineTo(x, y); pctx.stroke(); };
pad.onpointerup = () => (drawing = false);
$("#typed").oninput = (e) => {
  padClear(); pctx.fillStyle = "#111"; pctx.textBaseline = "middle";
  pctx.font = "italic 56px 'Brush Script MT','Segoe Script',cursive";
  pctx.fillText(e.target.value, 20, pad.height / 2, pad.width - 40);
};
$("#clr").onclick = () => { padClear(); $("#typed").value = ""; };
$("#cancel").onclick = () => ($("#modal").style.display = "none");
$("#apply").onclick = () => {
  const blank = !pctx.getImageData(0, 0, pad.width, pad.height).data.some((v, i) => i % 4 === 3 && v);
  if (blank) return alert("Please draw or type a signature first.");
  S.sigTarget.value = pad.toDataURL("image/png");
  $("#modal").style.display = "none";
  renderFields();
};
function openSig(f) { S.sigTarget = f; padClear(); $("#typed").value = ""; $("#modal").style.display = "flex"; }

// ---------- Backend (Apps Script) ----------
const API = "https://script.google.com/macros/s/AKfycbwWwz1weCJ938Gq_dZ3Og6yDhPzMWFcOaRUIUbujEkXS0O7_HHRCJmpsqV-GMbCZPvU/exec";
let TOKEN = localStorage.getItem("si_token") || "";

function setToken(t) {
  TOKEN = t;
  if (t) localStorage.setItem("si_token", t); else localStorage.removeItem("si_token");
  $("#acct").textContent = t ? "Log out" : "Log in";
}
setToken(TOKEN);

async function api(action, data) {
  $("#hint").textContent = "Working…";
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, data: data || {}, token: TOKEN })
    });
    const j = await r.json();
    if (!j.success && j.error === "UNAUTHORIZED") setToken("");
    return j;
  } catch (e) {
    return { success: false, message: "Could not reach the server. Check the web app deployment." };
  } finally {
    $("#hint").textContent = "";
  }
}
function toB64(buf) {
  const b = new Uint8Array(buf);
  let s = "";
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function fromB64(s) { return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)).buffer; }

let reg = false;
function authMode(r) {
  reg = r;
  $("#authT").textContent = r ? "Create account" : "Log in";
  $("#aGo").textContent = r ? "Create account" : "Log in";
  $("#aSwitch").textContent = r ? "I have an account" : "Create account";
  $("#aCompany").style.display = r ? "" : "none";
  $("#aName").style.display = r ? "" : "none";
  $("#aMsg").textContent = "";
}
function needLogin() {
  if (TOKEN) return false;
  authMode(false);
  $("#authM").style.display = "flex";
  return true;
}
$("#acct").onclick = async () => {
  if (TOKEN) { await api("logout"); setToken(""); } else needLogin();
};
$("#aSwitch").onclick = () => authMode(!reg);
$("#aClose").onclick = () => ($("#authM").style.display = "none");
$("#aGo").onclick = async () => {
  const email = $("#aEmail").value, password = $("#aPass").value;
  $("#aMsg").textContent = "Working…";
  if (reg) {
    const r = await api("register", { companyName: $("#aCompany").value, name: $("#aName").value, email, password });
    if (r.success) authMode(false);
    $("#aMsg").textContent = r.success ? r.data.message : r.message;
  } else {
    const r = await api("login", { email, password });
    if (r.success) { setToken(r.data.token); $("#authM").style.display = "none"; }
    else $("#aMsg").textContent = r.message;
  }
};

$("#saveT").onclick = async () => {
  if (!S.buf) return alert("Upload a PDF first.");
  if (!S.fields.length) return alert("Add at least one field first.");
  if (needLogin()) return;
  const name = prompt("Template name:", S.name || "Untitled");
  if (!name) return;
  const r = await api("saveTemplate", {
    name,
    pdfBase64: toB64(S.buf),
    fields: S.fields.map((f) => ({ page: f.page, type: f.type, x: f.x, y: f.y, w: f.w, h: f.h, required: f.type !== "checkbox" }))
  });
  if (r.success) { S.templateId = r.data.templateId; alert("Template saved."); } else alert(r.message);
};

$("#lClose").onclick = () => ($("#listM").style.display = "none");
$("#loadT").onclick = async () => {
  if (needLogin()) return;
  const r = await api("listTemplates");
  if (!r.success) return alert(r.message);
  const box = $("#tl");
  box.innerHTML = r.data.length ? "" : "No templates yet.";
  r.data.forEach((t) => {
    const row = document.createElement("div");
    row.className = "tl";
    const b = document.createElement("button");
    b.textContent = "Open";
    row.append(t.name, b);
    box.append(row);
    b.onclick = async () => {
      const g = await api("getTemplate", { templateId: t.templateId });
      if (!g.success) return alert(g.message);
      $("#listM").style.display = "none";
      S.name = g.data.name;
      S.templateId = t.templateId;
      await loadPdf(fromB64(g.data.pdfBase64), g.data.fields.map((f) => ({ ...f, id: uid(), value: f.type === "checkbox" ? false : "" })));
      setMode("sign");
    };
  });
  $("#listM").style.display = "flex";
};

// ---------- Export signed PDF ----------
$("#dl").onclick = async () => {
  if (!S.buf) return alert("Upload a PDF first.");
  if (!S.fields.length) return alert("Add at least one field first.");
  const missing = S.fields.filter((f) => f.type !== "checkbox" && !f.value).length;
  if (missing && !confirm(missing + " field(s) are empty. Download anyway?")) return;
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.load(S.buf.slice(0));
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const pages = doc.getPages();
  for (const f of S.fields) {
    const pg = pages[f.page];
    const { width: W, height: H } = pg.getSize();
    const bx = f.x * W, bw = f.w * W, bh = f.h * H, by = H - (f.y + f.h) * H;
    if (f.type === "checkbox") {
      if (f.value) {
        const o = Math.min(bw, bh) * 0.2;
        pg.drawLine({ start: { x: bx + o, y: by + o }, end: { x: bx + bw - o, y: by + bh - o }, thickness: 1.5, color: rgb(0, 0, 0) });
        pg.drawLine({ start: { x: bx + o, y: by + bh - o }, end: { x: bx + bw - o, y: by + o }, thickness: 1.5, color: rgb(0, 0, 0) });
      }
    } else if (f.type === "signature") {
      if (!f.value) continue;
      const img = await doc.embedPng(f.value);
      const k = Math.min(bw / img.width, bh / img.height);
      pg.drawImage(img, { x: bx + (bw - img.width * k) / 2, y: by + (bh - img.height * k) / 2, width: img.width * k, height: img.height * k });
    } else if (f.value) {
      const size = Math.max(6, Math.min(14, bh * 0.65));
      const text = String(f.value).replace(/[^\x20-\xFF]/g, "?");
      pg.drawText(text, { x: bx + 2, y: by + (bh - size) / 2 + size * 0.15, size, font, color: rgb(0, 0, 0), maxWidth: bw - 4 });
    }
  }
  const bytes = await doc.save();
  if (TOKEN && S.templateId) {
    const r = await api("saveSigned", { templateId: S.templateId, pdfBase64: toB64(bytes) });
    if (r.success) $("#hint").textContent = "Signed copy also saved to your Drive.";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  a.download = "signed.pdf";
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
